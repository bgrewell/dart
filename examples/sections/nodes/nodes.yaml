nodes:
  - name: local
    type: local
    options:
      shell: /bin/bash
      sudo:
        password: "password"
        env_var: "SUDO_PASSWORD"
        vault_secret: ""

  - name: ssh
    type: ssh
    options:
      host: 10.114.143.151
      user: ubuntu
      key: /home/ben/.ssh/id_dart
      # Host keys are verified against ~/.ssh/known_hosts by default.
      # Point elsewhere with known_hosts: <path>, or opt out for
      # throwaway lab targets with insecure_skip_host_key: true.

  - name: lxd
    type: lxd
    options:
      image: ubuntu:24.04
      type: container
      exec_options:
        shell: /bin/bash

  - name: docker
    type: docker
    options:
      image: test_server:latest
      exec_opts:
        shell: /bin/bash
      networks:
        - name: test_net
          ip: 192.168.200.10